server {
    listen 80;
    listen [::]:80;
    server_name tesla.ponypro.party;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://tesla.ponypro.party$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tesla.ponypro.party;
    ssl_certificate /etc/nginx/certs/tesla.ponypro.party/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/tesla.ponypro.party/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4k;
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://172.20.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host tesla.ponypro.party;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
}
