# Bootstrap HTTP-01 validation only, before the HTTPS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name tesla.ponypro.party;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
